<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
   <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <meta name="google-site-verification" content="2AERPUx5KW7XJhm7Hh3g1vVLXC5nzXZoMIcmWN2VGlQ" />
  <title>IKON Welfare Society Certificate Verification</title>
  <meta name="description"
        content="Official certificate verification portal of IKON Welfare Society. Verify student certificates online using registration number and DOB.">

  <meta name="keywords"
        content="IKON Welfare Society, certificate verification, IKON Institute, student certificate verification">
 <style>
  body { font-family: Arial, sans-serif; background:#f4f7fb; margin:0; padding:20px; color:#222; }

  .card {
    max-width: 900px;
    margin:auto;
    background:white;
    border-radius:16px;
    box-shadow:0 4px 20px rgba(0,0,0,.08);
    overflow:hidden;
  }
.slider {
  width: 100%;
  max-width: 860px;
  margin: 20px auto;
  position: relative;
  border-radius: 18px;
  overflow: hidden;
  box-shadow: 0 8px 25px rgba(0,0,0,0.18);
  background: white;
}

.slider {
  width: 100%;
  max-width: 860px;
  margin: 20px auto;
  position: relative;
  border-radius: 18px;
  overflow: hidden;
  box-shadow: 0 8px 25px rgba(0,0,0,0.18);
  background: white;
}

.slide {
  width: 100%;
  height: 420px;
  object-fit: cover;
  display: none;
  transition: opacity 0.5s ease-in-out;
}

.slide.active {
  display: block;
}

.gallery-title {
  text-align: center;
  font-size: 24px;
  font-weight: bold;
  color: #1847d1;
  margin-top: 20px;
}
  .header {
    text-align:center;
    padding:25px;
    border-bottom:1px solid #eee;
    background: linear-gradient(135deg, #1847d1, #0f2d85);
    color: white;
  }

  .header img {
    max-width:120px;
    margin-bottom:10px;
  }

  .title {
    font-size:34px;
    font-weight:bold;
    letter-spacing:1px;
    margin-top:8px;
  }

  .subtitle {
    font-size:16px;
    margin-top:6px;
    opacity:0.95;
  }

  .address {
    font-size:14px;
    margin-top:8px;
    opacity:0.9;
  }

  .contact {
    font-size:15px;
    font-weight:bold;
    margin-top:6px;
  }

  .verified {
    background:#eafaf0;
    color:#117a37;
    text-align:center;
    padding:14px;
    font-size:22px;
    font-weight:bold;
  }

  .details {
    padding:24px;
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:16px;
  }

  .item {
    background:#f8fafc;
    padding:14px;
    border-radius:10px;
  }

  .label {
    font-size:12px;
    color:#666;
    text-transform:uppercase;
  }

  .value {
    font-size:18px;
    font-weight:600;
    margin-top:4px;
  }

  .pdf { padding:24px; }

  iframe {
    width:100%;
    height:600px;
    border:none;
    border-radius:10px;
  }

  .error {
    text-align:center;
    padding:40px;
    color:red;
  }
</style>
</head>
<body>
  <div class="card" id="app">Loading...</div>

<script>
const params = new URLSearchParams(window.location.search);
const regFromQR = params.get('reg');
const app = document.getElementById('app');

// Google Sheet se data fetch
fetch('https://opensheet.elk.sh/1zdVCJk81D6Kud22DZJJLXalFL0MKhzkvanSV0IYiQBQ/Sheet1')
  .then(r => r.json())
  .then(students => {

    // CASE 1: Agar QR se aaya (?reg=...)
    if (regFromQR) {
      const student = students.find(s => s["Reg No"] === regFromQR);

      if (!student) {
        app.innerHTML = '<div class="error">Certificate not found.</div>';
        return;
      }

      showStudent(student);
    }

    // CASE 2: Direct website open hui → login page dikhao
    else {
      app.innerHTML = `
        <div class="header">
          <img src="ikon.jpg">
          <div class="title">IKON INSTITUTE</div>
          <div class="subtitle">Student Login</div>
        </div>

        <div style="padding:30px; text-align:center;">
          <h2>Certificate Login</h2>

          <input id="loginReg"
                 placeholder="Enter Registration Number"
                 style="padding:10px; width:250px;"><br><br>

          <input id="loginDOB"
                 type="password"
                 placeholder="Enter DOB (DDMMYYYY)"
                 style="padding:10px; width:250px;"><br><br>

          <button onclick="loginStudent()"
                  style="padding:10px 20px; cursor:pointer;">
            Login
          </button>

          <p id="loginMsg" style="color:red;"></p>
        </div>
      `;

      // global me save
      window.allStudents = students;
    }
  });


// LOGIN FUNCTION
function loginStudent() {
  const reg = document.getElementById("loginReg").value.trim();
  const dob = document.getElementById("loginDOB").value.trim();

  const student = window.allStudents.find(
    s => s["Reg No"] === reg && s["DOB"] === dob
  );

  if (student) {
    showStudent(student);
  } else {
    document.getElementById("loginMsg").innerText =
      "Invalid Reg No or DOB";
  }
}


// STUDENT DETAILS SHOW
function showStudent(student) {
  app.innerHTML = `
    <div class="header">
      <img src="ikon.jpg">
      <div class="title">IKON INSTITUTE</div>
      <div class="subtitle">A Symbol of Success</div>
    </div>

    <div class="verified">✓ CERTIFICATE VERIFIED</div>

    <div class="details">
      <div class="item">
        <div class="label">Student Name</div>
        <div class="value">${student["Name"]}</div>
      </div>

      <div class="item">
        <div class="label">Registration Number</div>
        <div class="value">${student["Reg No"]}</div>
      </div>

      <div class="item">
        <div class="label">Course</div>
        <div class="value">${student["Course"]}</div>
      </div>

      <div class="item">
        <div class="label">Grade</div>
        <div class="value">${student["Grade"]}</div>
      </div>

      <div class="item">
        <div class="label">Course Start Date</div>
        <div class="value">${student["Start Date"]}</div>
      </div>

      <div class="item">
        <div class="label">Course End Date</div>
        <div class="value">${student["End Date"]}</div>
      </div>
    </div>

    <div class="pdf">
      <h3>Unlock Certificate PDF</h3>
      <p>Enter DOB (DDMMYYYY)</p>

      <input type="password"
             id="dobInput"
             placeholder="e.g. 12052001"
             style="padding:10px; width:200px;">

      <button onclick="checkDOB('${student["DOB"]}','${student["pdf"] || ""}')"
              style="padding:10px 15px;">
        Unlock
      </button>

      <p id="msg" style="color:red;"></p>
      <div id="pdfBox" style="display:none;"></div>
    </div>
  `;
}


// PDF unlock
function checkDOB(correctDOB, pdfFile) {
  const entered = document.getElementById("dobInput").value.trim();
  const msg = document.getElementById("msg");
  const pdfBox = document.getElementById("pdfBox");

  if (entered === correctDOB.trim()) {
    msg.innerText = "";

    if (pdfFile) {
      pdfBox.style.display = "block";
      pdfBox.innerHTML = `<iframe src="${pdfFile}"></iframe>`;
    } else {
      pdfBox.style.display = "block";
      pdfBox.innerHTML = "PDF not uploaded yet.";
    }

  } else {
    msg.innerText = "Wrong DOB!";
    pdfBox.style.display = "none";
  }
}
</script>
</body>
</html>
