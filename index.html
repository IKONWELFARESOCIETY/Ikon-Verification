<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<meta name="google-site-verification" content="2AERPUx5KW7XJhm7Hh3g1vVLXC5nzXZoMIcmWN2VGlQ" />

<title>IKON Welfare Society Certificate Verification</title>

<style>
body{
  font-family:Arial,sans-serif;
  background:#f4f7fb;
  margin:0;
  padding:20px;
  color:#222;
}

/* MAIN CARD */
.card{
  max-width:900px;
  margin:auto;
  background:white;
  border-radius:16px;
  box-shadow:0 4px 20px rgba(0,0,0,.08);
  overflow:hidden;
}

/* HEADER */
.header{
  text-align:center;
  padding:25px;
  background:linear-gradient(135deg,#1847d1,#0f2d85);
  color:white;
}

.header img{
  width:180px;
  max-width:90%;
}

.title{
  font-size:34px;
  font-weight:bold;
}

.subtitle{
  font-size:16px;
  margin-top:6px;
}

/* VERIFIED BANNER */
.verified{
  background:#eafaf0;
  color:#117a37;
  text-align:center;
  padding:14px;
  font-size:22px;
  font-weight:bold;
}

/* DETAILS GRID */
.details{
  padding:24px;
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:16px;
}

.item{
  background:#f8fafc;
  padding:14px;
  border-radius:10px;
}

.label{
  font-size:12px;
  color:#666;
  text-transform:uppercase;
}

.value{
  font-size:18px;
  font-weight:600;
  margin-top:4px;
}

/* ERROR */
.error{
  text-align:center;
  padding:40px;
  color:red;
}

/* =========================
   NETFLIX STYLE SLIDER
========================= */
.netflix-slider{
  width:100%;
  max-width:860px;
  height:420px;
  margin:20px auto;
  position:relative;
  overflow:hidden;
  border-radius:18px;
  box-shadow:0 15px 40px rgba(0,0,0,0.3);
}

.nf-slide{
  position:absolute;
  width:100%;
  height:100%;
  object-fit:cover;
  opacity:0;
  transform:scale(1.1);
  transition:all 1.2s ease;
}

.nf-slide.active{
  opacity:1;
  transform:scale(1);
}

/* dark overlay */
.overlay{
  position:absolute;
  inset:0;
  background:linear-gradient(
    to top,
    rgba(0,0,0,0.7),
    rgba(0,0,0,0.2),
    rgba(0,0,0,0.6)
  );
}

/* caption */
.caption{
  position:absolute;
  bottom:25px;
  left:25px;
  color:white;
  z-index:2;
}

.caption h2{
  font-size:28px;
  margin:0;
}

.caption p{
  font-size:16px;
  opacity:0.8;
}

/* LOGIN BOX */
.login-box{
  padding:30px;
  text-align:center;
}

input, select{
  padding:10px;
  width:250px;
  margin:8px 0;
  border:1px solid #ccc;
  border-radius:8px;
}

button{
  padding:10px 20px;
  cursor:pointer;
  border:none;
  background:#1847d1;
  color:white;
  border-radius:8px;
}

button:hover{
  background:#1238a9;
}

.gallery-title{
  text-align:center;
  font-size:20px;
  font-weight:bold;
  color:#1847d1;
  margin-top:20px;
}
</style>
</head>

<body>

<div class="card" id="app">Loading...</div>

<script>
const params = new URLSearchParams(window.location.search);
const regFromQR = params.get('reg');
const app = document.getElementById('app');

let slideIndex = 0;
let sliderStarted = false;

function startSlider(){
  if(sliderStarted) return;
  sliderStarted = true;

  setInterval(() => {
    const slides = document.querySelectorAll('.nf-slide');
    if(slides.length === 0) return;

    slides.forEach(s => s.classList.remove('active'));

    slideIndex++;
    if(slideIndex >= slides.length) slideIndex = 0;

    slides[slideIndex].classList.add('active');
  }, 3000);
}

fetch('https://opensheet.elk.sh/1zdVCJk81D6Kud22DZJJLXalFL0MKhzkvanSV0IYiQBQ/Sheet1')
.then(r => r.json())
.then(students => {

  if(regFromQR){
    const student = students.find(s => s["Reg No"] === regFromQR);

    if(!student){
      app.innerHTML = '<div class="error">Certificate not found.</div>';
      return;
    }

    showStudent(student);

  } else {

    window.allStudents = students;

    app.innerHTML = `
      <div class="header">
        <img src="ikon.jpg">
        <div class="title">IKON INSTITUTE</div>
        <div class="subtitle">Student Login Portal</div>
      </div>

      <div class="gallery-title">IKON Institute Activities</div>

      <div class="netflix-slider">
        <img src="img1.jpeg" class="nf-slide active">
        <img src="img2.jpeg" class="nf-slide">
        <img src="img3.jpeg" class="nf-slide">
        <img src="img4.jpeg" class="nf-slide">
        <img src="img5.jpeg" class="nf-slide">

        <div class="overlay"></div>

        <div class="caption">
          <h2>IKON INSTITUTE</h2>
          <p>A Symbol of Success</p>
        </div>
      </div>

      <div class="login-box">
        <h2>Certificate Login</h2>

        <input id="loginReg" placeholder="Enter Registration Number"><br>
        <input id="loginDOB" type="password" placeholder="Enter DOB (DDMMYYYY)"><br>

        <button onclick="loginStudent()">Login</button>

        <p id="loginMsg" style="color:red;"></p>
      </div>
    `;

    startSlider();
  }
});

function loginStudent(){
  const reg = document.getElementById("loginReg").value.trim();
  const dob = document.getElementById("loginDOB").value.trim();

  const student = window.allStudents.find(
    s => s["Reg No"] === reg && s["DOB"] === dob
  );

  if(student){
    showStudent(student);
  } else {
    document.getElementById("loginMsg").innerText = "Invalid Reg No or DOB";
  }
}

function showStudent(student){
  window.currentStudent = student;

  app.innerHTML = `
    <div class="header">
      <img src="ikon.jpg">
      <div class="title">IKON INSTITUTE</div>
      <div class="subtitle">A Symbol of Success</div>
    </div>

    <div class="verified">✓ CERTIFICATE VERIFIED</div>

    <div class="details">

      <div class="item">
        <div class="label">Name</div>
        <div class="value">${student["Name"]}</div>
      </div>

      <div class="item">
        <div class="label">Reg No</div>
        <div class="value">${student["Reg No"]}</div>
      </div>

      <div class="item">
        <div class="label">Course</div>
        <div class="value">${student["Course"]}</div>
      </div>

      <div class="item">
        <div class="label">Grade</div>
        <div class="value">${student["Grade"]}</div>
      </div>

    </div>
  `;
}
</script>

</body>
</html>
