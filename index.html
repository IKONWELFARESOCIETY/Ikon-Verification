<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>IKON Institute Certificate Verification</title>

<style>
body{
  margin:0;
  font-family:Segoe UI, sans-serif;
  background:#000;
  color:white;
  overflow:hidden;
}

/* ================= PARTICLES ================= */
#particles{
  position:fixed;
  inset:0;
  z-index:0;
}

.particle{
  position:absolute;
  width:5px;
  height:5px;
  background:rgba(255,255,255,0.8);
  border-radius:50%;
  animation:floatUp linear infinite;
}

@keyframes floatUp{
  from{transform:translateY(100vh);opacity:0;}
  to{transform:translateY(-10vh);opacity:1;}
}

/* ================= SLIDER ================= */
.slider{
  position:absolute;
  inset:0;
  z-index:1;
}

.slide{
  position:absolute;
  width:100%;
  height:100%;
  object-fit:contain;
  object-position:center;
  background:#000;
  opacity:0;
  transform:scale(1.05);
  transition:all 1.5s ease;
  filter:brightness(1.2) contrast(1.1) saturate(1.3);
}

.slide.active{
  opacity:1;
  transform:scale(1);
}

/* ================= OVERLAY ================= */
.overlay{
  position:absolute;
  inset:0;
  background:radial-gradient(circle,rgba(255,255,255,0.05),rgba(0,0,0,0.7));
  z-index:2;
}

/* ================= LOGIN ================= */
.center{
  position:absolute;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
  width:90%;
  max-width:420px;
  text-align:center;
  z-index:3;
}

.login-box{
  background:rgba(255,255,255,0.08);
  backdrop-filter:blur(18px);
  border:1px solid rgba(255,255,255,0.2);
  border-radius:16px;
  padding:25px;
}

/* TITLE */
h1{
  font-size:32px;
  background:linear-gradient(90deg,#fff,#ffd700,#fff);
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
}

input{
  width:100%;
  padding:12px;
  margin:8px 0;
  border:none;
  border-radius:8px;
}

button{
  width:100%;
  padding:12px;
  border:none;
  border-radius:8px;
  background:#1847d1;
  color:white;
  cursor:pointer;
}

/* ================= CERTIFICATE ================= */
.cert{
  background:white;
  color:black;
  padding:30px;
  border-radius:12px;
  margin-top:20px;
  text-align:center;
}

.cert h2{
  color:#1847d1;
}

.cert-box{
  border:10px solid #1847d1;
  padding:25px;
}

/* MOBILE FIX */
@media(max-width:768px){
  .slide{
    object-fit:contain;
    background:#000;
    height:100vh;
  }
}
</style>
</head>

<body>

<!-- PARTICLES -->
<div id="particles"></div>

<!-- SLIDER -->
<div class="slider">
  <img src="img1.jpeg" class="slide active">
  <img src="img2.jpeg" class="slide">
  <img src="img3.jpeg" class="slide">
  <img src="img4.jpeg" class="slide">
  <img src="img5.jpeg" class="slide">
  <img src="img6.jpeg" class="slide">
  <img src="img7.jpeg" class="slide">
  <img src="img8.jpeg" class="slide">
  <img src="img9.jpeg" class="slide">
  <img src="img10.jpeg" class="slide">
  <img src="img11.jpeg" class="slide">
  <img src="img12.jpeg" class="slide">
  <img src="img13.jpeg" class="slide">
</div>

<div class="overlay"></div>

<!-- LOGIN -->
<div class="center">

  <h1>IKON INSTITUTE</h1>

  <div class="login-box">
    <input id="reg" placeholder="Registration Number">
    <input id="dob" placeholder="DOB (DDMMYYYY)">
    <button onclick="login()">Login</button>
  </div>

  <div id="result"></div>

</div>

<script>
const API_URL = "https://script.google.com/macros/s/AKfycbzZNUs7DX_z71cCniWinmAztbs0wunZjyl7JVKRET0z3QEZDFJyoeDgZSksKWIBCU0u/exec";

/* ================= SLIDER FIX ================= */
let slides = document.querySelectorAll(".slide");
let index = 0;

slides.forEach(s => s.classList.remove("active"));
slides[0].classList.add("active");

setInterval(()=>{
  slides[index].classList.remove("active");
  index = (index + 1) % slides.length;
  slides[index].classList.add("active");
},3000);

/* ================= PARTICLES ================= */
const container = document.getElementById("particles");

function createParticle(){
  let p = document.createElement("div");
  p.classList.add("particle");
  p.style.left = Math.random()*100 + "vw";
  p.style.animationDuration = (4 + Math.random()*6) + "s";
  container.appendChild(p);
  setTimeout(()=>p.remove(),10000);
}
setInterval(createParticle,150);

/* ================= LOGIN + SHEET FETCH ================= */
async function login(){

  let reg = document.getElementById("reg").value;
  let dob = document.getElementById("dob").value;

  let res = await fetch(API_URL, {
    method:"POST",
    body:JSON.stringify({reg,dob})
  });

  let data = await res.json();

  if(data.status === "FOUND"){

    document.getElementById("result").innerHTML = `
      <div class="cert">
        <div class="cert-box">

          <h2>IKON WELFARE SOCIETY</h2>
          <h3>CERTIFICATE OF COMPLETION</h3>

          <p>This is to certify that</p>
          <h2>${data.name}</h2>

          <p><b>Reg No:</b> ${data.reg}</p>
          <p><b>Course:</b> ${data.course}</p>
          <p><b>Grade:</b> ${data.grade}</p>

          <p><b>Duration:</b> ${data.start} to ${data.end}</p>

          <p><b>Verification Date:</b> ${data.date}</p>

        </div>
      </div>
    `;

  } else {
    alert("Invalid Login");
  }
}
</script>

</body>
</html>
