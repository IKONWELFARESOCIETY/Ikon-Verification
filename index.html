<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>IKON Institute Portal</title>

<style>
body{
  margin:0;
  font-family:Segoe UI, sans-serif;
  background:#000;
  color:white;
}

/* HERO */
.hero{
  position:relative;
  width:100%;
  height:100vh;
  overflow:hidden;
}

/* SLIDER IMAGES */
.bg-slide{
  position:absolute;
  width:100%;
  height:100%;
  object-fit:cover;
  opacity:0;
  transform:scale(1.15);
  transition:all 1.5s ease;
  filter:brightness(1.4) contrast(1.2) saturate(1.4);
}

.bg-slide.active{
  opacity:1;
  transform:scale(1);
}

/* DARK OVERLAY (LIGHT) */
.hero::after{
  content:"";
  position:absolute;
  inset:0;
  background:linear-gradient(
    to top,
    rgba(0,0,0,0.55),
    rgba(0,0,0,0.2),
    rgba(0,0,0,0.45)
  );
}

/* LIGHT GLOW EFFECT */
.hero::before{
  content:"";
  position:absolute;
  inset:0;
  background:
    radial-gradient(circle at 30% 30%, rgba(255,255,255,0.08), transparent 50%),
    radial-gradient(circle at 70% 60%, rgba(255,215,0,0.06), transparent 55%);
  pointer-events:none;
}

/* CENTER BOX */
.center{
  position:absolute;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
  text-align:center;
  width:90%;
  max-width:400px;
  z-index:5;
}

/* LOGIN GLASS BOX */
.login-box{
  background:rgba(255,255,255,0.08);
  backdrop-filter:blur(15px);
  border:1px solid rgba(255,255,255,0.2);
  border-radius:18px;
  padding:25px;
}

/* TITLE */
h1{
  margin:0;
  font-size:34px;
  background:linear-gradient(90deg,#fff,#ffd700,#fff);
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
}

/* INPUT */
input{
  width:100%;
  padding:12px;
  margin:8px 0;
  border:none;
  border-radius:10px;
}

/* BUTTON */
button{
  width:100%;
  padding:12px;
  border:none;
  border-radius:10px;
  background:#1847d1;
  color:white;
  cursor:pointer;
}

button:hover{
  background:#0f2d85;
}

/* CAPTION */
.badge{
  display:inline-block;
  padding:6px 12px;
  font-size:12px;
  border-radius:20px;
  background:rgba(255,255,255,0.15);
  margin-bottom:10px;
}

/* ================= MOBILE FIX ================= */
@media(max-width:768px){
  .hero{
    height:260px;
  }

  .bg-slide{
    object-fit:contain;   /* ⭐ no image cut */
    background:#000;
  }
}

@media(max-width:480px){
  .hero{
    height:220px;
  }
}
</style>
</head>

<body>

<div class="hero">

  <!-- 13 IMAGES -->
  <img src="img1.jpeg" class="bg-slide active">
  <img src="img2.jpeg" class="bg-slide">
  <img src="img3.jpeg" class="bg-slide">
  <img src="img4.jpeg" class="bg-slide">
  <img src="img5.jpeg" class="bg-slide">
  <img src="img6.jpeg" class="bg-slide">
  <img src="img7.jpeg" class="bg-slide">
  <img src="img8.jpeg" class="bg-slide">
  <img src="img9.jpeg" class="bg-slide">
  <img src="img10.jpeg" class="bg-slide">
  <img src="img11.jpeg" class="bg-slide">
  <img src="img12.jpeg" class="bg-slide">
  <img src="img13.jpeg" class="bg-slide">

  <!-- CENTER LOGIN -->
  <div class="center">

    <div class="badge">WELCOME TO</div>
    <h1>IKON INSTITUTE</h1>

    <div class="login-box">
      <input type="text" placeholder="Registration Number">
      <input type="password" placeholder="DOB (DDMMYYYY)">
      <button>Login</button>
    </div>

  </div>

</div>

<script>
let i = 0;

setInterval(()=>{
  const slides = document.querySelectorAll(".bg-slide");

  slides.forEach(s => s.classList.remove("active"));

  i = (i + 1) % slides.length;

  slides[i].classList.add("active");

},3000);
</script>

</body>
</html>
