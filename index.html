<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IKON Ultra Verification</title>

<style>

/* ================= GLOBAL ================= */
body{
margin:0;
font-family:Segoe UI;
background:#0a0f2c;
}

/* ================= LOGIN PAGE ================= */
#loginPage{
position:fixed;
inset:0;
overflow:hidden;
}

/* IMAGE SLIDER */
.slide{
position:absolute;
width:100%;
height:100%;
object-fit:contain;
background:black;
opacity:0;
transition:1.2s ease;
filter:brightness(1.2) contrast(1.1) saturate(1.3);
}

.slide.active{opacity:1}

/* DARK OVERLAY */
.overlay{
position:absolute;
inset:0;
background:rgba(0,0,0,0.6);
}

/* LOGIN BOX */
.loginBox{
position:absolute;
top:50%;
left:50%;
transform:translate(-50%,-50%);
width:90%;
max-width:400px;
background:rgba(255,255,255,0.08);
padding:20px;
border-radius:15px;
backdrop-filter:blur(12px);
text-align:center;
color:white;
}

input,button{
width:100%;
padding:10px;
margin:5px 0;
border:none;
border-radius:8px;
}

button{
background:#1847d1;
color:white;
cursor:pointer;
}

/* ================= AFTER LOGIN PAGE ================= */
#dataPage{
display:none;
padding:20px;
color:white;
}

/* COURSE GLOW SLIDER */
.glowBar{
background:linear-gradient(90deg,#1847d1,#0f2d85,#1847d1);
padding:10px;
overflow:hidden;
white-space:nowrap;
box-shadow:0 0 20px #1847d1;
margin-top:10px;
}

.glowBar span{
display:inline-block;
padding-left:100%;
animation:scroll 12s linear infinite;
font-weight:bold;
text-shadow:0 0 10px white;
}

.glowBar:hover span{
animation-play-state:paused;
}

@keyframes scroll{
from{transform:translateX(100%)}
to{transform:translateX(-100%)}
}

/* ================= CERT PAGE ================= */
#certPage{
display:none;
background:#f5f7ff;
min-height:100vh;
padding:20px;
}

.cert{
max-width:750px;
margin:auto;
background:white;
padding:40px;
border:10px solid #1847d1;
text-align:center;
box-shadow:0 10px 30px rgba(0,0,0,0.2);
color:black;
}

.logo{
width:120px;
}

.photo{
width:150px;
height:170px;
object-fit:cover;
border:4px solid #1847d1;
border-radius:8px;
margin:15px 0;
}

</style>
</head>

<body>

<!-- ================= LOGIN PAGE ================= -->
<div id="loginPage">

<img src="img2.jpg" class="slide active">
<img src="img3.jpg" class="slide">
<img src="img4.jpg" class="slide">
<img src="img5.jpg" class="slide">
<img src="img6.jpg" class="slide">
<img src="img7.jpg" class="slide">
<img src="img8.jpg" class="slide">
<img src="img9.jpg" class="slide">
<img src="img10.jpg" class="slide">
<img src="img11.jpg" class="slide">
<img src="img12.jpg" class="slide">
<img src="img13.jpg" class="slide">

<div class="overlay"></div>

<div class="loginBox">
<h2>IKON INSTITUTE</h2>
<input id="reg" placeholder="Reg No">
<input id="dob" placeholder="DOB">
<button onclick="login()">Login</button>
<div id="result"></div>
</div>

</div>

<!-- ================= DATA PAGE ================= -->
<div id="dataPage">

<h2>Student Dashboard</h2>

<div id="info"></div>

<!-- COURSE GLOW AFTER LOGIN -->
<div class="glowBar">
<span>DCA • ADCA • PGDAM • POWER BI • ADVANCE EXCEL • DIGITAL SKILLS • CAREER GROWTH • SUCCESS •</span>
</div>

<button onclick="openCert()">View Certificate</button>

</div>

<!-- ================= CERT PAGE ================= -->
<div id="certPage">

<div class="cert">

<img src="ikon.jpeg" class="logo">

<h2>IKON WELFARE SOCIETY</h2>

<img id="cPhoto" class="photo">

<h3 id="cName"></h3>
<p id="cReg"></p>
<p id="cCourse"></p>
<p id="cGrade"></p>

<input id="certDob" placeholder="Enter DOB">
<button onclick="unlockCert()">Unlock Certificate</button>

<p id="msg"></p>

<!-- COURSE AGAIN IN CERT -->
<div class="glowBar">
<span>DCA • ADCA • PGDAM • POWER BI • SUCCESS • CAREER BUILDING • DIGITAL SKILLS •</span>
</div>

</div>

</div>

<script>

const API="https://script.google.com/macros/s/AKfycbzZNUs7DX_z71cCniWinmAztbs0wunZjyl7JVKRET0z3QEZDFJyoeDgZSksKWIBCU0u/exec";

let slides=document.querySelectorAll(".slide");
let i=0;

setInterval(()=>{
slides[i].classList.remove("active");
i=(i+1)%slides.length;
slides[i].classList.add("active");
},3000);

let studentData;

/* LOGIN */
async function login(){

let reg=document.getElementById("reg").value;
let dob=document.getElementById("dob").value;

let res=await fetch(API+"?reg="+reg+"&dob="+dob);
let d=await res.json();

if(d.status==="FOUND"){

studentData=d;

document.getElementById("loginPage").style.display="none";
document.getElementById("dataPage").style.display="block";

document.getElementById("info").innerHTML=`
<p><b>Name:</b> ${d.name}</p>
<p><b>Course:</b> ${d.course}</p>
<p><b>Grade:</b> ${d.grade}</p>
`;

}else{
alert("Invalid Login");
}

}

/* OPEN CERT */
function openCert(){

document.getElementById("dataPage").style.display="none";
document.getElementById("certPage").style.display="block";

document.getElementById("cName").innerText=studentData.name;
document.getElementById("cReg").innerText=studentData.reg;
document.getElementById("cCourse").innerText=studentData.course;
document.getElementById("cGrade").innerText=studentData.grade;

/* REG BASED PHOTO FIX (.jpg) */
document.getElementById("cPhoto").src = studentData.reg + ".jpg";

}

/* CERT UNLOCK */
function unlockCert(){

let val=document.getElementById("certDob").value;

if(val!==studentData.dob){
document.getElementById("msg").innerText="Wrong DOB";
return;
}

document.getElementById("msg").innerHTML=
"Certificate Verified ✔ " + new Date().toLocaleDateString();

}

</script>

</body>
</html>
