<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IKON Verification Pro</title>

<style>

/* ===== BACKGROUND ===== */
body{
  margin:0;
  font-family:Segoe UI;
  background:#0a0f2c;
  color:white;
  overflow-x:hidden;
}

/* ===== SLIDER ===== */
.slider{
  position:fixed;
  inset:0;
  z-index:0;
}

.slide{
  position:absolute;
  width:100%;
  height:100%;
  object-fit:contain;
  background:black;
  opacity:0;
  transition:1.5s ease;
  filter:brightness(1.2) contrast(1.1) saturate(1.2);
}

.slide.active{
  opacity:1;
}

/* DARK OVERLAY */
.overlay{
  position:fixed;
  inset:0;
  background:radial-gradient(circle,rgba(0,0,0,0.4),rgba(0,0,0,0.85));
  z-index:1;
}

/* ===== LOGIN ===== */
.center{
  position:absolute;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
  width:90%;
  max-width:420px;
  z-index:2;
}

.box{
  background:rgba(255,255,255,0.08);
  backdrop-filter:blur(18px);
  border-radius:18px;
  padding:25px;
  text-align:center;
  border:1px solid rgba(255,255,255,0.2);
}

h1{
  margin:0;
  font-size:30px;
  background:linear-gradient(90deg,#fff,#ffd700,#fff);
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
}

input{
  width:100%;
  padding:12px;
  margin:6px 0;
  border:none;
  border-radius:10px;
}

button{
  width:100%;
  padding:12px;
  border:none;
  border-radius:10px;
  background:linear-gradient(90deg,#1847d1,#0f2d85);
  color:white;
  font-weight:bold;
  cursor:pointer;
}

/* ===== RESULT ===== */
.result{
  margin-top:15px;
  text-align:left;
}

.card{
  background:white;
  color:black;
  padding:15px;
  border-radius:12px;
}

/* ================= CERTIFICATE ================= */
.certificate{
  background:white;
  color:black;
  margin-top:15px;
  padding:40px;
  border:12px solid #1847d1;
  border-radius:12px;
  text-align:center;
  box-shadow:0 25px 60px rgba(0,0,0,0.6);
  position:relative;
}

/* LOGO TOP CENTER */
.cert-logo{
  width:120px;
  margin-bottom:10px;
}

/* TITLE */
.cert-title{
  font-size:28px;
  font-weight:bold;
  color:#1847d1;
}

/* SLOGAN ANIMATION */
.slogan{
  margin:10px 0;
  font-weight:bold;
  color:#444;
  overflow:hidden;
  white-space:nowrap;
  border-right:3px solid #1847d1;
  animation:typing 6s steps(40,end) infinite;
}

@keyframes typing{
  0%{width:0}
  50%{width:100%}
  100%{width:0}
}

/* STUDENT PHOTO */
.photo{
  width:150px;
  height:170px;
  object-fit:cover;
  border-radius:10px;
  border:4px solid #1847d1;
  margin:15px 0;
  box-shadow:0 10px 20px rgba(0,0,0,0.3);
}

/* COURSE BOX SLIDER */
.course-box{
  margin-top:15px;
  background:#f2f6ff;
  padding:10px;
  border-radius:10px;
  overflow:hidden;
}

.course-track{
  display:inline-block;
  white-space:nowrap;
  animation:scroll 15s linear infinite;
}

.course-box:hover .course-track{
  animation-play-state:paused;
}

@keyframes scroll{
  0%{transform:translateX(100%)}
  100%{transform:translateX(-100%)}
}

/* DOB INPUT BOX (NO ALERT) */
.unlock-box{
  margin-top:15px;
  padding:15px;
  background:#eef3ff;
  border-radius:10px;
}

.unlock-box input{
  width:70%;
  padding:10px;
  border:1px solid #ccc;
}

.unlock-box button{
  width:25%;
}

/* MOBILE FIX */
@media(max-width:768px){
  .slide{object-fit:contain;}
}

</style>
</head>

<body>

<!-- SLIDER -->
<div class="slider">
  <img src="img2.jpeg" class="slide active">
  <img src="img3.jpeg" class="slide">
  <img src="img4.jpeg" class="slide">
  <img src="img5.jpeg" class="slide">
  <img src="img6.jpeg" class="slide">
  <img src="img7.jpeg" class="slide">
  <img src="img8.jpeg" class="slide">
  <img src="img9.jpeg" class="slide">
  <img src="img10.jpeg" class="slide">
  <img src="img11.jpeg" class="slide">
  <img src="img12.jpeg" class="slide">
  <img src="img13.jpeg" class="slide">
</div>

<div class="overlay"></div>

<!-- LOGIN -->
<div class="center">
<div class="box">

<h1>IKON INSTITUTE</h1>
<p>Verification Portal</p>

<input id="reg" placeholder="Registration Number">
<input id="dob" placeholder="DOB (DDMMYYYY)">
<button onclick="login()">Login</button>

<div id="output" class="result"></div>

</div>
</div>

<script>

const API="https://script.google.com/macros/s/AKfycbzZNUs7DX_z71cCniWinmAztbs0wunZjyl7JVKRET0z3QEZDFJyoeDgZSksKWIBCU0u/exec";

let slides=document.querySelectorAll(".slide");
let i=0;

setInterval(()=>{
  slides[i].classList.remove("active");
  i=(i+1)%slides.length;
  slides[i].classList.add("active");
},3000);

/* LOGIN */
async function login(){

let reg=document.getElementById("reg").value;
let dob=document.getElementById("dob").value;

let res=await fetch(API+"?reg="+reg+"&dob="+dob);
let d=await res.json();

if(d.status==="FOUND"){

document.getElementById("output").innerHTML=`

<div class="card">
<b>Name:</b> ${d.name}<br>
<b>Course:</b> ${d.course}<br>
<b>Grade:</b> ${d.grade}
</div>

<button onclick="showCert('${d.reg}','${d.name}','${d.course}','${d.grade}','${d.start}','${d.end}','${d.dob}')">
View Certificate
</button>

`;

}else{
alert("Invalid Credentials");
}

}

/* CERTIFICATE */
function showCert(reg,name,course,grade,start,end,dob){

document.getElementById("output").innerHTML+=`

<div class="certificate">

<img src="ikon.jpeg" class="cert-logo">

<div class="cert-title">IKON WELFARE SOCIETY</div>

<div class="slogan">
DCA • ADCA • PGDAM • POWER BI • BUILD YOUR FUTURE • SUCCESS STARTS HERE
</div>

<img class="photo" src="${reg}.jpeg" onerror="this.style.display='none'">

<h2>${name}</h2>
<p><b>${reg}</b></p>

<div class="course-box">
<div class="course-track">
DCA • ADCA • PGDAM • POWER BI • ADVANCE EXCEL • DIGITAL SKILLS • CAREER GROWTH • SUCCESS MINDSET
</div>
</div>

<div class="unlock-box">
<input id="unlockDob" placeholder="Enter DOB">
<button onclick="verify('${dob}')">Unlock</button>
</div>

<div id="certData"></div>

</div>

`;

}

/* VERIFY DOB INLINE */
function verify(realDob){

let val=document.getElementById("unlockDob").value;

if(val!==realDob){
alert("Wrong DOB");
return;
}

document.getElementById("certData").innerHTML=`
<p><b>Certificate Unlocked ✔</b></p>
<p>Verification Date: ${new Date().toLocaleDateString()}</p>
`;

}

</script>

</body>
</html>
