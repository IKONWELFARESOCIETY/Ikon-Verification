<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IKON Institute Verification</title>

<style>
body{
  margin:0;
  font-family:Segoe UI;
  background:#000;
  color:white;
  overflow-x:hidden;
}

/* SLIDER */
.slider{
  position:fixed;
  inset:0;
  z-index:0;
}

.slide{
  position:absolute;
  width:100%;
  height:100%;
  object-fit:contain;
  background:#000;
  opacity:0;
  transition:1.5s ease;
}

.slide.active{
  opacity:1;
}

/* OVERLAY */
.overlay{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.6);
  z-index:1;
}

/* CENTER */
.center{
  position:absolute;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
  width:90%;
  max-width:420px;
  text-align:center;
  z-index:2;
}

.box{
  background:rgba(255,255,255,0.08);
  padding:20px;
  border-radius:12px;
  backdrop-filter:blur(12px);
}

input,button{
  width:100%;
  padding:10px;
  margin:5px 0;
  border:none;
  border-radius:8px;
}

button{
  background:#1847d1;
  color:white;
  cursor:pointer;
}

/* CARD */
.card{
  margin-top:15px;
  background:white;
  color:black;
  padding:15px;
  border-radius:10px;
}

/* CERTIFICATE */
.cert{
  margin-top:15px;
  background:white;
  color:black;
  padding:25px;
  border:10px solid #1847d1;
  text-align:center;
}

.cert img{
  width:130px;
  height:150px;
  object-fit:cover;
  border:3px solid #1847d1;
  margin-bottom:10px;
}

/* MOBILE FIX */
@media(max-width:768px){
  .slide{
    object-fit:contain;
    background:#000;
  }
}
</style>
</head>

<body>

<div class="slider">
  <img src="img1.jpeg" class="slide active">
  <img src="img2.jpeg" class="slide">
  <img src="img3.jpeg" class="slide">
  <img src="img4.jpeg" class="slide">
  <img src="img5.jpeg" class="slide">
  <img src="img6.jpeg" class="slide">
  <img src="img7.jpeg" class="slide">
  <img src="img8.jpeg" class="slide">
  <img src="img9.jpeg" class="slide">
  <img src="img10.jpeg" class="slide">
  <img src="img11.jpeg" class="slide">
  <img src="img12.jpeg" class="slide">
  <img src="img13.jpeg" class="slide">
</div>

<div class="overlay"></div>

<div class="center">

<div class="box">

<h2>IKON LOGIN</h2>

<input id="reg" placeholder="Reg No">
<input id="dob" placeholder="DOB">
<button onclick="login()">Login</button>

<div id="out"></div>

</div>
</div>

<script>

const API="https://script.google.com/macros/s/AKfycbzZNUs7DX_z71cCniWinmAztbs0wunZjyl7JVKRET0z3QEZDFJyoeDgZSksKWIBCU0u/exec";

/* SLIDER */
let slides=document.querySelectorAll(".slide");
let i=0;

slides[0].classList.add("active");

setInterval(()=>{
  slides[i].classList.remove("active");
  i=(i+1)%slides.length;
  slides[i].classList.add("active");
},3000);

/* LOGIN */
async function login(){

let reg=document.getElementById("reg").value;
let dob=document.getElementById("dob").value;

let res=await fetch(API,{
method:"POST",
body:JSON.stringify({reg,dob})
});

let d=await res.json();

if(d.status==="FOUND"){

document.getElementById("out").innerHTML=`

<div class="card">
<h3>STUDENT DETAILS</h3>
<p><b>Name:</b> ${d.name}</p>
<p><b>Reg No:</b> ${d.reg}</p>
<p><b>Course:</b> ${d.course}</p>
<p><b>Grade:</b> ${d.grade}</p>
<p><b>Start:</b> ${d.start}</p>
<p><b>End:</b> ${d.end}</p>
</div>

<div class="card">
<h3>UNLOCK CERTIFICATE</h3>
<input id="udob" placeholder="Enter DOB">
<button onclick="unlockCert('${d.dob}','${d.name}','${d.reg}','${d.course}','${d.grade}','${d.start}','${d.end}')">Unlock</button>
</div>

`;

}else{
alert("Invalid Credentials");
}

}

/* CERTIFICATE */
function unlockCert(dob,name,reg,course,grade,start,end){

let enter=document.getElementById("udob").value;

if(enter!==dob){
alert("Wrong DOB");
return;
}

let today=new Date().toLocaleDateString();

document.getElementById("out").innerHTML+=`

<div class="cert">

<img src="photos/${reg}.jpeg"
onerror="this.style.display='none'">

<h2>IKON WELFARE SOCIETY</h2>
<h3>CERTIFICATE OF COMPLETION</h3>

<p>This certifies that</p>
<h2>${name}</h2>

<p><b>Reg:</b> ${reg}</p>
<p><b>Course:</b> ${course}</p>
<p><b>Grade:</b> ${grade}</p>
<p><b>Duration:</b> ${start} - ${end}</p>

<p><b>Verification Date:</b> ${today}</p>

</div>

`;

}

</script>

</body>
</html>
