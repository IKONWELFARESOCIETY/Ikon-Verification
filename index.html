<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IKON Verification System</title>

<style>

/* ================= GLOBAL ================= */
body{
margin:0;
font-family:Segoe UI;
background:#eef3ff;
color:#111;
}

/* ================= LOGIN ================= */
#loginPage{
position:fixed;
inset:0;
overflow:hidden;
}

.slide{
position:absolute;
width:100%;
height:100%;
object-fit:cover;
opacity:0;
transition:1s;
filter:brightness(1.1);
}

.slide.active{opacity:1}

.overlay{
position:absolute;
inset:0;
background:rgba(0,0,0,0.4);
}

.loginBox{
position:absolute;
top:50%;
left:50%;
transform:translate(-50%,-50%);
background:white;
padding:22px;
border-radius:15px;
width:90%;
max-width:380px;
box-shadow:0 10px 30px rgba(0,0,0,0.2);
text-align:center;
}

input,button{
width:100%;
padding:10px;
margin:6px 0;
border:1px solid #ddd;
border-radius:8px;
}

button{
background:#1847d1;
color:white;
border:none;
cursor:pointer;
}

/* ================= DASHBOARD ================= */
#dataPage{
display:none;
padding:25px;
background:#f6f9ff;
min-height:100vh;
}

.dashboardCard{
background:white;
padding:20px;
border-radius:12px;
box-shadow:0 10px 25px rgba(0,0,0,0.08);
max-width:800px;
margin:auto;
}

/* 2 COLUMN DATA */
.row{
display:flex;
justify-content:space-between;
padding:10px 0;
border-bottom:1px solid #eee;
font-size:16px;
}

.row b{
color:#1847d1;
}

/* ================= COURSE BAR ================= */
.glowBar{
margin-top:20px;
background:linear-gradient(90deg,#1847d1,#00c6ff,#1847d1);
padding:12px;
overflow:hidden;
white-space:nowrap;
border-radius:10px;
box-shadow:0 0 20px rgba(24,71,209,0.4);
}

.glowBar span{
display:inline-block;
padding-left:100%;
animation:scroll 11s linear infinite;
font-weight:bold;
color:white;
letter-spacing:1px;
}

@keyframes scroll{
from{transform:translateX(100%)}
to{transform:translateX(-100%)}
}

/* ================= CERTIFICATE ================= */

#certPage{
display:none;
min-height:100vh;
background:linear-gradient(135deg,#f3f7ff,#eaf1ff);
justify-content:center;
align-items:center;
padding:20px;
}

.cert{
position:relative;
width:900px;
max-width:95%;
background:white;
color:#111;
padding:50px;
border-radius:12px;
text-align:center;
overflow:hidden;
box-shadow:0 20px 50px rgba(0,0,0,0.15);
}

/* watermark image */
.cert::before{
content:"";
position:absolute;
inset:0;
background:url("ikon.jpg") no-repeat center;
background-size:340px;
opacity:0.06;
}

/* top line */
.cert::after{
content:"";
position:absolute;
top:0;
left:0;
width:100%;
height:5px;
background:linear-gradient(90deg,#1847d1,#00c6ff,#1847d1);
}

.logo{
width:100px;
}

.photo{
width:130px;
height:160px;
object-fit:cover;
border:3px solid #1847d1;
border-radius:10px;
margin:10px auto;
}

h2{
color:#1847d1;
margin:5px 0;
}

h1{
margin:10px 0;
font-size:24px;
}

.certGrid{
display:grid;
grid-template-columns:1fr 1fr;
gap:10px;
margin-top:15px;
font-size:15px;
}

.certGrid div{
padding:6px 0;
}

.verify{
margin-top:18px;
color:green;
font-weight:bold;
}

</style>
</head>

<body>

<!-- LOGIN -->
<div id="loginPage">

<img src="img2.jpg" class="slide active">
<img src="img3.jpg" class="slide">
<img src="img4.jpg" class="slide">
  <img src="img5.jpg" class="slide">
  <img src="img6.jpg" class="slide">
  <img src="img7.jpg" class="slide">
  <img src="img8.jpg" class="slide">
  <img src="img9.jpg" class="slide">
  <img src="img10.jpg" class="slide">
  <img src="img11.jpg" class="slide">
  <img src="img12.jpg" class="slide">
  <img src="img13.jpg" class="slide">

<div class="overlay"></div>

<div class="loginBox">
<h2>IKON INSTITUTE</h2>
<input id="reg" placeholder="Reg No">
<input id="dob" placeholder="DOB">
<button onclick="login()">Login</button>
</div>

</div>

<!-- DASHBOARD -->
<div id="dataPage">

<div class="dashboardCard">

<h2 style="text-align:center;color:#1847d1;">Student Dashboard</h2>

<div class="row"><b>Reg No:</b> <span id="dReg"></span></div>
<div class="row"><b>Name:</b> <span id="dName"></span></div>
<div class="row"><b>Course:</b> <span id="dCourse"></span></div>
<div class="row"><b>Grade:</b> <span id="dGrade"></span></div>
<div class="row"><b>Start Date:</b> <span id="dStart"></span></div>
<div class="row"><b>End Date:</b> <span id="dEnd"></span></div>

<div class="glowBar">
<span>
DCA • ADCA • PGDAM • POWER BI • LEARN • GROW • BUILD YOUR FUTURE • SUCCESS STARTS HERE • DIGITAL SKILLS •
</span>
</div>

<br>
<button onclick="openCert()">View Certificate</button>

</div>

</div>

<!-- CERTIFICATE -->
<div id="certPage">

<div class="cert">

<img src="ikon.jpeg" class="logo">

<h2>IKON WELFARE SOCIETY</h2>
<h1>Certificate of Completion</h1>

<img id="cPhoto" class="photo">

<h3 id="cName"></h3>

<div class="certGrid">
<div><b>Reg No:</b> <span id="cReg"></span></div>
<div><b>Course:</b> <span id="cCourse"></span></div>
<div><b>Grade:</b> <span id="cGrade"></span></div>
<div><b>Start:</b> <span id="cStart"></span></div>
<div><b>End:</b> <span id="cEnd"></span></div>
</div>

<div class="verify" id="cVerify"></div>

</div>

</div>

<script>

const API="https://script.google.com/macros/s/AKfycbzZNUs7DX_z71cCniWinmAztbs0wunZjyl7JVKRET0z3QEZDFJyoeDgZSksKWIBCU0u/exec";

let slides=document.querySelectorAll(".slide");
let i=0;

setInterval(()=>{
slides[i].classList.remove("active");
i=(i+1)%slides.length;
slides[i].classList.add("active");
},3000);

let studentData;

/* LOGIN */
async function login(){

let reg=document.getElementById("reg").value;
let dob=document.getElementById("dob").value;

let res=await fetch(API+"?reg="+reg+"&dob="+dob);
let d=await res.json();

if(d.status==="FOUND"){

studentData=d;

document.getElementById("loginPage").style.display="none";
document.getElementById("dataPage").style.display="block";

/* DASHBOARD DATA */
document.getElementById("dReg").innerText=d.reg;
document.getElementById("dName").innerText=d.name;
document.getElementById("dCourse").innerText=d.course;
document.getElementById("dGrade").innerText=d.grade;
document.getElementById("dStart").innerText=d.startDate;
document.getElementById("dEnd").innerText=d.endDate;

}else{
alert("Invalid Login");
}

}

/* CERT */
function openCert(){

document.getElementById("dataPage").style.display="none";
document.getElementById("certPage").style.display="flex";

document.getElementById("cName").innerText=studentData.name;
document.getElementById("cReg").innerText=studentData.reg;
document.getElementById("cCourse").innerText=studentData.course;
document.getElementById("cGrade").innerText=studentData.grade;
document.getElementById("cStart").innerText=studentData.startDate;
document.getElementById("cEnd").innerText=studentData.endDate;

document.getElementById("cPhoto").src=studentData.reg+".jpg";

document.getElementById("cVerify").innerText =
"Verified On: " + studentData.verifyDate;

}

</script>

</body>
</html>
