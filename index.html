<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>IKON Institute Portal</title>

<style>
body{
  margin:0;
  font-family:Segoe UI, sans-serif;
  background:#000;
  overflow:hidden;
  color:white;
}

/* ================= PARTICLES ================= */
#particles{
  position:fixed;
  inset:0;
  z-index:0;
}

.particle{
  position:absolute;
  width:5px;
  height:5px;
  background:rgba(255,255,255,0.8);
  border-radius:50%;
  animation:floatUp linear infinite;
  opacity:0.7;
}

@keyframes floatUp{
  from{
    transform:translateY(100vh) scale(0.5);
    opacity:0;
  }
  to{
    transform:translateY(-10vh) scale(1);
    opacity:1;
  }
}

/* ================= SLIDER ================= */
.slider{
  position:absolute;
  inset:0;
  z-index:1;
}

.slide{
  position:absolute;
  width:100%;
  height:100%;
  object-fit:cover;
  object-position:center;
  opacity:0;
  transform:scale(1.1);
  transition:all 1.5s ease;
  filter:brightness(1.3) contrast(1.1) saturate(1.4);
}

.slide.active{
  opacity:1;
  transform:scale(1);
}

.slide.active{
  opacity:1;
  transform:scale(1);
}

/* ================= OVERLAY ================= */
.overlay{
  position:absolute;
  inset:0;
  background:radial-gradient(circle at center, rgba(255,255,255,0.05), rgba(0,0,0,0.6));
  z-index:2;
}

/* ================= CENTER LOGIN ================= */
.center{
  position:absolute;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
  text-align:center;
  width:90%;
  max-width:400px;
  z-index:3;
}

/* GLASS BOX */
.login-box{
  background:rgba(255,255,255,0.08);
  backdrop-filter:blur(18px);
  border:1px solid rgba(255,255,255,0.2);
  border-radius:18px;
  padding:25px;
  box-shadow:0 20px 60px rgba(0,0,0,0.5);
}

/* TITLE */
h1{
  margin:0;
  font-size:34px;
  background:linear-gradient(90deg,#fff,#ffd700,#fff);
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
}

/* BADGE */
.badge{
  display:inline-block;
  padding:6px 12px;
  font-size:12px;
  border-radius:20px;
  background:rgba(255,255,255,0.12);
  margin-bottom:10px;
}

/* INPUT */
input{
  width:100%;
  padding:12px;
  margin:8px 0;
  border:none;
  border-radius:10px;
  outline:none;
}

/* BUTTON */
button{
  width:100%;
  padding:12px;
  border:none;
  border-radius:10px;
  background:#1847d1;
  color:white;
  cursor:pointer;
  transition:0.3s;
}

button:hover{
  background:#0f2d85;
  transform:scale(1.03);
}

@media (max-width:768px){

  .slider, .hero{
    height:100vh;
  }

  .slide{
    object-fit:contain;   /* ⭐ full image show */
    object-position:center;
    background:black;
  }
}
}
</style>
</head>

<body>

<!-- PARTICLES -->
<div id="particles"></div>

<!-- SLIDER (13 IMAGES) -->
<div class="slider">
  <img src="img1.jpeg" class="slide active">
  <img src="img2.jpeg" class="slide">
  <img src="img3.jpeg" class="slide">
  <img src="img4.jpeg" class="slide">
  <img src="img5.jpeg" class="slide">
  <img src="img6.jpeg" class="slide">
  <img src="img7.jpeg" class="slide">
  <img src="img8.jpeg" class="slide">
  <img src="img9.jpeg" class="slide">
  <img src="img10.jpeg" class="slide">
  <img src="img11.jpeg" class="slide">
  <img src="img12.jpeg" class="slide">
  <img src="img13.jpeg" class="slide">
</div>

<!-- OVERLAY -->
<div class="overlay"></div>

<!-- CENTER LOGIN -->
<div class="center">

  <div class="badge">WELCOME TO</div>
  <h1>IKON INSTITUTE</h1>

  <div class="login-box">
    <input type="text" placeholder="Registration Number">
    <input type="password" placeholder="DOB (DDMMYYYY)">
    <button>Login</button>
  </div>

</div>

<script>
/* ================= SLIDER ================= */
let i = 0;

setInterval(()=>{
  const slides = document.querySelectorAll(".slide");

  slides.forEach(s => s.classList.remove("active"));

  i = (i + 1) % slides.length;

  slides[i].classList.add("active");

},3000);

/* ================= PARTICLES ================= */
const container = document.getElementById("particles");

function createParticle(){
  const p = document.createElement("div");
  p.classList.add("particle");

  p.style.left = Math.random()*100 + "vw";
  p.style.animationDuration = (5 + Math.random()*6) + "s";
  p.style.opacity = Math.random();

  container.appendChild(p);

  setTimeout(()=>p.remove(),10000);
}

setInterval(createParticle,150);
</script>

</body>
</html>
