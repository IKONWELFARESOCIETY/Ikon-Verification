<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IKON Verification System</title>

<style>

/* ===== BACKGROUND ===== */
body{
  margin:0;
  font-family:Segoe UI;
  background:#0a0f2c;
  color:white;
  overflow-x:hidden;
}

/* ===== SLIDER ===== */
.slider{
  position:fixed;
  inset:0;
  z-index:0;
}

.slide{
  position:absolute;
  width:100%;
  height:100%;
  object-fit:contain;
  background:black;
  opacity:0;
  transition:1.5s ease;
  filter:brightness(1.2) contrast(1.1) saturate(1.2);
}

.slide.active{
  opacity:1;
}

/* OVERLAY */
.overlay{
  position:fixed;
  inset:0;
  background:radial-gradient(circle,rgba(0,0,0,0.4),rgba(0,0,0,0.85));
  z-index:1;
}

/* ===== LOGIN BOX ===== */
.center{
  position:absolute;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
  width:90%;
  max-width:420px;
  z-index:2;
}

.box{
  background:rgba(255,255,255,0.08);
  backdrop-filter:blur(18px);
  border-radius:18px;
  padding:25px;
  border:1px solid rgba(255,255,255,0.2);
  text-align:center;
}

h1{
  margin:0;
  font-size:30px;
  background:linear-gradient(90deg,#fff,#ffd700,#fff);
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
}

input{
  width:100%;
  padding:12px;
  margin:6px 0;
  border:none;
  border-radius:10px;
  outline:none;
}

button{
  width:100%;
  padding:12px;
  border:none;
  border-radius:10px;
  background:linear-gradient(90deg,#1847d1,#0f2d85);
  color:white;
  font-weight:bold;
  cursor:pointer;
}

/* ===== RESULT ===== */
.result{
  margin-top:15px;
  text-align:left;
}

.card{
  background:white;
  color:black;
  padding:15px;
  border-radius:12px;
  margin-top:10px;
}

/* ===== CERTIFICATE ===== */
.certificate{
  background:white;
  color:black;
  margin-top:15px;
  padding:35px;
  border:12px solid #1847d1;
  border-radius:10px;
  text-align:center;
  box-shadow:0 20px 40px rgba(0,0,0,0.5);
}

.certificate h2{
  color:#1847d1;
  margin:10px 0;
}

/* ===== PHOTO FIX (REG NO IMAGE) ===== */
.photo{
  width:140px;
  height:160px;
  object-fit:cover;
  border:3px solid #1847d1;
  margin:10px 0;
  border-radius:6px;
}

/* BADGE */
.badge{
  display:inline-block;
  padding:6px 15px;
  background:#1847d1;
  color:white;
  border-radius:20px;
  font-size:12px;
}

/* MOBILE IMAGE FIX ONLY */
@media(max-width:768px){
  .slide{
    object-fit:contain;
  }
}

</style>
</head>

<body>

<!-- SLIDER -->
<div class="slider">
  <img src="img2.jpeg" class="slide active">
  <img src="img3.jpeg" class="slide">
  <img src="img4.jpeg" class="slide">
  <img src="img5.jpeg" class="slide">
  <img src="img6.jpeg" class="slide">
  <img src="img7.jpeg" class="slide">
  <img src="img8.jpeg" class="slide">
  <img src="img9.jpeg" class="slide">
  <img src="img10.jpeg" class="slide">
  <img src="img11.jpeg" class="slide">
  <img src="img12.jpeg" class="slide">
  <img src="img13.jpeg" class="slide">
</div>

<div class="overlay"></div>

<!-- LOGIN -->
<div class="center">

<div class="box">

<h1>IKON INSTITUTE</h1>
<p>Certificate Verification Portal</p>

<input id="reg" placeholder="Registration Number">
<input id="dob" placeholder="DOB (DDMMYYYY)">
<button onclick="login()">Login</button>

<div id="output" class="result"></div>

</div>

</div>

<script>

/* 🔥 YOUR API */
const API="https://script.google.com/macros/s/AKfycbzZNUs7DX_z71cCniWinmAztbs0wunZjyl7JVKRET0z3QEZDFJyoeDgZSksKWIBCU0u/exec";

/* SLIDER */
let slides=document.querySelectorAll(".slide");
let i=0;

setInterval(()=>{
  slides[i].classList.remove("active");
  i=(i+1)%slides.length;
  slides[i].classList.add("active");
},3000);

/* LOGIN */
async function login(){

let reg=document.getElementById("reg").value;
let dob=document.getElementById("dob").value;

let res=await fetch(API+"?reg="+reg+"&dob="+dob);
let d=await res.json();

if(d.status==="FOUND"){

document.getElementById("output").innerHTML=`

<div class="card">
<b>Name:</b> ${d.name}<br>
<b>Reg No:</b> ${d.reg}<br>
<b>Course:</b> ${d.course}<br>
<b>Grade:</b> ${d.grade}<br>
<b>Start:</b> ${d.start}<br>
<b>End:</b> ${d.end}
</div>

<button onclick="unlockCert('${d.name}','${d.reg}','${d.course}','${d.grade}','${d.start}','${d.end}','${d.dob}')">
Unlock Certificate
</button>

`;

}else{
alert("Invalid Credentials");
}

}

/* CERTIFICATE */
function unlockCert(name,reg,course,grade,start,end,dob){

let enter=prompt("Enter DOB to unlock certificate");

if(enter!==dob){
alert("Wrong DOB");
return;
}

let today=new Date().toLocaleDateString();

document.getElementById("output").innerHTML+=`

<div class="certificate">

<div class="badge">VERIFIED</div>

<!-- ✔ FIXED PHOTO (REG NO BASED) -->
<img class="photo"
src="${reg}.jpeg"
onerror="this.style.display='none'">

<h2>IKON WELFARE SOCIETY</h2>
<h3>CERTIFICATE OF COMPLETION</h3>

<p>This is to certify that</p>
<h2>${name}</h2>

<p><b>Reg No:</b> ${reg}</p>
<p><b>Course:</b> ${course}</p>
<p><b>Grade:</b> ${grade}</p>
<p><b>Duration:</b> ${start} - ${end}</p>

<p><b>Verification Date:</b> ${today}</p>

</div>

`;

}

</script>

</body>
</html>
