<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <meta name="google-site-verification" content="2AERPUx5KW7XJhm7Hh3g1vVLXC5nzXZoMIcmWN2VGlQ" />

  <title>IKON Welfare Society Certificate Verification</title>

  <meta name="description"
        content="Official certificate verification portal of IKON Welfare Society. Verify student certificates online using registration number and DOB.">

  <meta name="keywords"
        content="IKON Welfare Society, certificate verification, IKON Institute">

<style>
  .course-slider{
  background: linear-gradient(90deg,#1847d1,#0f2d85);
  color:white;
  padding:12px 0;
  overflow:hidden;
  white-space:nowrap;
  font-weight:bold;
  font-size:18px;
}
  .slider{
  width:100%;
  max-width:860px;
  margin:20px auto;
  position:relative;
  border-radius:18px;
  overflow:hidden;
  box-shadow:0 8px 25px rgba(0,0,0,0.18);
}

.slide{
  width:100%;
  height:380px;
  object-fit:cover;
  display:none;
  animation: zoomFade 6s ease-in-out;
}

.slide.active{
  display:block;
}

@keyframes zoomFade{
  from{
    opacity:0.7;
    transform:scale(1);
  }
  to{
    opacity:1;
    transform:scale(1.05);
  }
}

.gallery-title{
  text-align:center;
  font-size:22px;
  font-weight:bold;
  color:#1847d1;
  margin-top:20px;
}

.course-track{
  display:inline-block;
  padding-left:100%;
  animation: scrollCourses 22s linear infinite;
}

.course-item{
  display:inline-block;
  margin-right:80px;
}

.course-name{
  font-size:20px;
  color:#ffd700;
}

.course-desc{
  font-size:14px;
  font-weight:normal;
  color:#fff;
}

@keyframes scrollCourses{
  0%{
    transform:translateX(0);
  }
  100%{
    transform:translateX(-100%);
  }
}
body{
  font-family:Arial,sans-serif;
  background:#f4f7fb;
  margin:0;
  padding:20px;
  color:#222;
}
.card{
  max-width:900px;
  margin:auto;
  background:white;
  border-radius:16px;
  box-shadow:0 4px 20px rgba(0,0,0,.08);
  overflow:hidden;
}
.header{
  text-align:center;
  padding:25px;
  background:linear-gradient(135deg,#1847d1,#0f2d85);
  color:white;
}
.header img{
  width:200px;
  max-width:90%;
}
}
.title{
  font-size:34px;
  font-weight:bold;
}
.subtitle{
  font-size:16px;
  margin-top:6px;
}
.verified{
  background:#eafaf0;
  color:#117a37;
  text-align:center;
  padding:14px;
  font-size:22px;
  font-weight:bold;
}
.details{
  padding:24px;
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:16px;
}
.item{
  background:#f8fafc;
  padding:14px;
  border-radius:10px;
}
.label{
  font-size:12px;
  color:#666;
  text-transform:uppercase;
}
.value{
  font-size:18px;
  font-weight:600;
  margin-top:4px;
}
.pdf{
  padding:24px;
}
.error{
  text-align:center;
  padding:40px;
  color:red;
}
</style>
</head>

<body>

<div class="card" id="app">Loading...</div>

<script>
const params = new URLSearchParams(window.location.search);
const regFromQR = params.get('reg');
const app = document.getElementById('app');

fetch('https://opensheet.elk.sh/1zdVCJk81D6Kud22DZJJLXalFL0MKhzkvanSV0IYiQBQ/Sheet1')
.then(r => r.json())
.then(students => {

  if(regFromQR){
    const student = students.find(
      s => s["Reg No"] === regFromQR
    );

    if(!student){
      app.innerHTML =
        '<div class="error">Certificate not found.</div>';
      return;
    }

    showStudent(student);

  }else{
    window.allStudents = students;

    app.innerHTML = `
      <div class="header">
        <img src="ikon.jpg">
        <div class="title">IKON INSTITUTE</div>
        <div class="subtitle">Student Login</div>
      </div>
      <div style="padding:30px;text-align:center;">
      <div class="gallery-title">
  IKON Institute Activities
</div>

<div class="slider">
  <img src="img1.jpeg" class="slide active">
  <img src="img2.jpeg" class="slide">
   <img src="img3.jpeg" class="slide">
    <img src="img4.jpeg" class="slide">
</div>

      <div style="padding:30px;text-align:center;">
        <h2>Certificate Login</h2>

        <input id="loginReg"
               placeholder="Enter Registration Number"
               style="padding:10px;width:250px;"><br><br>

        <input id="loginDOB"
               type="password"
               placeholder="Enter DOB (DDMMYYYY)"
               style="padding:10px;width:250px;"><br><br>

        <button onclick="loginStudent()"
                style="padding:10px 20px;cursor:pointer;">
          Login
        </button>

        <p id="loginMsg" style="color:red;"></p>
      </div>
    `;
  }
});

function loginStudent(){
  const reg =
    document.getElementById("loginReg").value.trim();

  const dob =
    document.getElementById("loginDOB").value.trim();

  const student = window.allStudents.find(
    s => s["Reg No"] === reg &&
         s["DOB"] === dob
  );

  if(student){
    showStudent(student);
  }else{
    document.getElementById("loginMsg")
      .innerText = "Invalid Reg No or DOB";
  }
}

function showStudent(student){

  window.currentStudent = student;

  app.innerHTML = `
    <div class="header">
      <img src="ikon.jpg">
      <div class="title">IKON INSTITUTE</div>
      <div class="subtitle">A Symbol of Success</div>
    </div>

    <div class="verified">
      ✓ CERTIFICATE VERIFIED
    </div>
    <div class="course-slider">
  <div class="course-track">

    <span class="course-item">
      <span class="course-name">DCA</span> —
      <span class="course-desc">
        Diploma in Computer Applications | Build essential computer skills for office, internet & digital work.
      </span>
    </span>

    <span class="course-item">
      <span class="course-name">ADCA</span> —
      <span class="course-desc">
        Advanced Diploma in Computer Applications | Become job-ready with advanced software, accounting & practical training.
      </span>
    </span>

    <span class="course-item">
      <span class="course-name">PGDAM</span> —
      <span class="course-desc">
        Post Graduate Diploma in Accounting & Management | Upgrade your career in finance, GST & business management.
      </span>
    </span>

    <span class="course-item">
      <span class="course-name">Power BI</span> —
      <span class="course-desc">
        Data Analytics & Interactive Dashboard Design | Master dashboards and data visualization for modern careers.
      </span>
    </span>

  </div>
</div>

    <div class="details">
      <div class="item">
        <div class="label">Student Name</div>
        <div class="value">${student["Name"]}</div>
      </div>

      <div class="item">
        <div class="label">Registration Number</div>
        <div class="value">${student["Reg No"]}</div>
      </div>

      <div class="item">
        <div class="label">Course</div>
        <div class="value">${student["Course"]}</div>
      </div>

      <div class="item">
        <div class="label">Grade</div>
        <div class="value">${student["Grade"]}</div>
      </div>

      <div class="item">
        <div class="label">Course Start Date</div>
        <div class="value">${student["Start Date"]}</div>
      </div>

      <div class="item">
        <div class="label">Course End Date</div>
        <div class="value">${student["End Date"]}</div>
      </div>
    </div>

    <div class="pdf">
      <h3>Unlock Certificate</h3>
      <p>Enter DOB (DDMMYYYY)</p>

      <input type="password"
             id="dobInput"
             placeholder="e.g. 12052001"
             style="padding:10px;width:200px;">

      <button onclick="checkDOB()"
              style="padding:10px 15px;">
        Unlock
      </button>

      <p id="msg" style="color:red;"></p>

      <div id="pdfBox"
           style="display:none;">
      </div>
    </div>
  `;
}

function checkDOB(){

  const student = window.currentStudent;

  const entered =
    document.getElementById("dobInput")
      .value.trim();

  const msg =
    document.getElementById("msg");

  const pdfBox =
    document.getElementById("pdfBox");

  if(entered === student["DOB"].trim()){

    msg.innerText = "";
    pdfBox.style.display = "block";

    const reg = student["Reg No"];

    pdfBox.innerHTML = `
      <div style="
        margin-top:20px;
        background:#fff;
        border:12px solid #1847d1;
        padding:50px;
        text-align:center;
        border-radius:16px;
        box-shadow:0 6px 20px rgba(0,0,0,.08);
      ">

        <img src="ikon.jpg"
             style="width:150px;">

        <div style="margin:20px 0;">
          <img src="photos/${reg}.jpeg"
               style="
                 width:140px;
                 height:170px;
                 object-fit:cover;
                 border:3px solid #1847d1;
                 border-radius:8px;
                 box-shadow:0 4px 10px rgba(0,0,0,.15);
               "
               onerror="this.style.display='none'">
        </div>

        <h1 style="
          color:#1847d1;
          font-size:34px;
          margin:10px 0;
        ">
          IKON WELFARE SOCIETY
        </h1>

        <h2 style="
          letter-spacing:2px;
          color:#333;
        ">
          CERTIFICATE OF COMPLETION
        </h2>

        <p>This is to certify that</p>

        <h2 style="
          border-bottom:2px solid #ccc;
          display:inline-block;
          padding-bottom:6px;
        ">
          ${student["Name"]}
        </h2>

        <p>
          Registration No:
          <b>${student["Reg No"]}</b>
        </p>

        <p>has successfully completed</p>

        <h3 style="
          color:#1847d1;
          font-size:28px;
        ">
          ${student["Course"]}
        </h3>

        <p>
          Duration:
          ${student["Start Date"]}
          to
          ${student["End Date"]}
        </p>

        <p>
          Grade Awarded:
          <b>${student["Grade"]}</b>
        </p>

        <div style="
          margin-top:40px;
          padding:15px;
          background:#f8fafc;
          border-radius:10px;
          border:1px solid #ddd;
          text-align:left;
        ">
          <h3 style="
            margin-top:0;
            color:#1847d1;
          ">
            Verification Data
          </h3>

          <p>
            <b>Verification Status:</b>
            Successfully Verified
          </p>

          <p>
            <b>Verification Date:</b>
            ${student["Verification Date"]}
          </p>
        </div>
      </div>
    `;

  }else{
    msg.innerText = "Wrong DOB!";
    pdfBox.style.display = "none";
  }
}
  setInterval(() => {
  const slides = document.querySelectorAll('.slide');
  let current = 0;

  slides.forEach((slide, i) => {
    if(slide.classList.contains('active')){
      slide.classList.remove('active');
      current = i;
    }
  });

  let next = (current + 1) % slides.length;
  slides[next].classList.add('active');
}, 3000);
</script>

</body>
</html>
