<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>IKON Institute - Certificate Verification</title>
  <style>
    body { font-family: Arial, sans-serif; background:#f4f7fb; margin:0; padding:20px; color:#222; }
    .card { max-width: 900px; margin:auto; background:white; border-radius:16px; box-shadow:0 4px 20px rgba(0,0,0,.08); overflow:hidden; }
    .header { text-align:center; padding:20px; border-bottom:1px solid #eee; }
    .header img { max-width:260px; }
    .title { font-size:28px; font-weight:bold; color:#1847d1; margin-top:10px; }
    .subtitle { color:#666; }
    .verified { background:#eafaf0; color:#117a37; text-align:center; padding:14px; font-size:22px; font-weight:bold; }
    .details { padding:24px; display:grid; grid-template-columns:1fr 1fr; gap:16px; }
    .item { background:#f8fafc; padding:14px; border-radius:10px; }
    .label { font-size:12px; color:#666; text-transform:uppercase; }
    .value { font-size:18px; font-weight:600; margin-top:4px; }
    .pdf { padding:24px; }
    iframe { width:100%; height:600px; border:none; border-radius:10px; }
    .error { text-align:center; padding:40px; color:red; }
  </style>
</head>
<body>
  <div class="card" id="app">Loading...</div>

<script>
const params = new URLSearchParams(window.location.search);
const reg = params.get('reg');

fetch('https://opensheet.elk.sh/1zdVCJk81D6Kud22DZJJLXalFL0MKhzkvanSV0IYiQBQ/Sheet1')
  .then(r => r.json())
  .then(students => {
    const student = students.find(s => s["Reg No"] === reg);
    const app = document.getElementById('app');

    if (!student) {
      app.innerHTML = '<div class="error">Certificate not found.</div>';
      return;
    }

    app.innerHTML = `
      <div class="header">
        <img src="ikon.jpg">
        <div class="title">IKON Institute</div>
        <div class="subtitle">A Symbol of Success</div>
      </div>

      <div class="verified">✓ CERTIFICATE VERIFIED</div>

      <div class="details">
        <div class="item"><div class="label">Student Name</div><div class="value">${student["Name"]}</div></div>
        <div class="item"><div class="label">Registration Number</div><div class="value">${student["Reg No"]}</div></div>
        <div class="item"><div class="label">Course</div><div class="value">${student["Course"]}</div></div>
        <div class="item"><div class="label">Grade</div><div class="value">${student["Grade"]}</div></div>
        <div class="item"><div class="label">Course Start Date</div><div class="value">${student["Start Date"]}</div></div>
        <div class="item"><div class="label">Course End Date</div><div class="value">${student["End Date"]}</div></div>
      </div>

      <div class="pdf">
        <h3>Unlock Certificate PDF</h3>
        <p>Enter DOB (DDMMYYYY)</p>
        <input type="password" id="dobInput" placeholder="e.g. 12052001" 
               style="padding:10px; width:200px;">
        <button onclick="checkDOB('${student["DOB"]}','${student["pdf"]}')"
                style="padding:10px 15px; cursor:pointer;">
          Unlock PDF
        </button>
        <p id="msg" style="color:red;"></p>

        <div id="pdfBox" style="display:none; margin-top:20px;">
          <iframe id="pdfFrame"></iframe>
        </div>
      </div>
    `;
  });

function checkDOB(correctDOB, pdfFile) {
  const entered = document.getElementById("dobInput").value.trim();

  if (entered === correctDOB.trim()) {
    document.getElementById("pdfBox").style.display = "block";
    document.getElementById("pdfFrame").src = pdfFile;
    document.getElementById("msg").innerText = "";
  } else {
    document.getElementById("msg").innerText = "Wrong DOB!";
  }
}
</script>
</body>
</html>
