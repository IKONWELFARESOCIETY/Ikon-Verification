<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IKON Verification System</title>

<style>

body{
margin:0;
font-family:Segoe UI;
background:#0a0f2c;
color:white;
}

/* ================= LOGIN ================= */
#loginPage{
position:fixed;
inset:0;
overflow:hidden;
}

.slide{
position:absolute;
width:100%;
height:100%;
object-fit:cover;
opacity:0;
transition:1s;
filter:brightness(1.2);
}

.slide.active{opacity:1}

.overlay{
position:absolute;
inset:0;
background:rgba(0,0,0,0.6);
}

.loginBox{
position:absolute;
top:50%;
left:50%;
transform:translate(-50%,-50%);
background:rgba(255,255,255,0.1);
padding:20px;
border-radius:15px;
width:90%;
max-width:400px;
backdrop-filter:blur(10px);
text-align:center;
}

input,button{
width:100%;
padding:10px;
margin:6px 0;
border:none;
border-radius:8px;
}

button{
background:#1847d1;
color:white;
cursor:pointer;
}

/* ================= DASHBOARD ================= */
#dataPage{
display:none;
padding:20px;
text-align:center;
}

/* SCROLLING COURSE BAR (ULTRA PRO) */
.glowBar{
margin-top:20px;
background:linear-gradient(90deg,#1847d1,#00c6ff,#1847d1);
padding:12px;
overflow:hidden;
white-space:nowrap;
box-shadow:0 0 25px #1847d1;
border-radius:10px;
}

.glowBar span{
display:inline-block;
padding-left:100%;
animation:scroll 10s linear infinite;
font-weight:bold;
letter-spacing:1px;
}

.glowBar:hover span{
animation-play-state:paused;
}

@keyframes scroll{
from{transform:translateX(100%)}
to{transform:translateX(-100%)}
}

/* ================= CERTIFICATE ================= */

#certPage{
display:none;
min-height:100vh;
background:linear-gradient(135deg,#06122d,#02040f);
justify-content:center;
align-items:center;
padding:20px;
}

.cert{
position:relative;
width:900px;
max-width:95%;
background:white;
color:black;
padding:50px;
border-radius:12px;
text-align:center;
overflow:hidden;
box-shadow:0 25px 60px rgba(0,0,0,0.6);
}

/* watermark image */
.cert::before{
content:"";
position:absolute;
inset:0;
background:url("ikon.jpg") no-repeat center;
background-size:320px;
opacity:0.08;
}

/* top line */
.cert::after{
content:"";
position:absolute;
top:0;
left:0;
width:100%;
height:6px;
background:linear-gradient(90deg,#1847d1,#00c6ff,#1847d1);
}

.logo{
width:110px;
}

.photo{
width:140px;
height:170px;
object-fit:cover;
border:4px solid #1847d1;
border-radius:10px;
margin:10px auto;
}

h2{
color:#1847d1;
}

.grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:10px;
margin-top:15px;
font-size:16px;
}

.verify{
margin-top:20px;
color:green;
font-weight:bold;
}

</style>
</head>

<body>

<!-- LOGIN -->
<div id="loginPage">

<img src="img2.jpg" class="slide active">
<img src="img3.jpg" class="slide">
<img src="img4.jpg" class="slide">
<img src="img5.jpg" class="slide">
  <img src="img6.jpg" class="slide">
  <img src="img7.jpg" class="slide">
  <img src="img8.jpg" class="slide">
  <img src="img9.jpg" class="slide">
  <img src="img10.jpg" class="slide">
  <img src="img11.jpg" class="slide">
  <img src="img12.jpg" class="slide">
  <img src="img13.jpg" class="slide">

<div class="overlay"></div>

<div class="loginBox">
<h2>IKON INSTITUTE</h2>
<input id="reg" placeholder="Reg No">
<input id="dob" placeholder="DOB">
<button onclick="login()">Login</button>
</div>

</div>

<!-- DASHBOARD (NEW PROFESSIONAL PAGE) -->
<div id="dataPage">

<h2>Welcome Student</h2>

<div id="info"></div>

<!-- ULTRA COURSE SCROLL -->
<div class="glowBar">
<span>
DCA • ADCA • PGDCA • ADV EXCEL • POWER BI • DIGITAL SKILLS • PROGRAMMING • CAREER GROWTH • SUCCESS •
</span>
</div>

<button onclick="openCert()">View Certificate</button>

</div>

<!-- CERTIFICATE -->
<div id="certPage">

<div class="cert">

<img src="ikon.jpeg" class="logo">

<h2>IKON WELFARE SOCIETY</h2>
<h1>Certificate of Completion</h1>

<img id="cPhoto" class="photo">

<h3 id="cName"></h3>

<div class="grid">
<div><b>Reg:</b> <span id="cReg"></span></div>
<div><b>Course:</b> <span id="cCourse"></span></div>
<div><b>Grade:</b> <span id="cGrade"></span></div>
<div><b>Start:</b> <span id="cStart"></span></div>
<div><b>End:</b> <span id="cEnd"></span></div>
</div>

<div class="verify" id="cVerify"></div>

</div>

</div>

<script>

const API="https://script.google.com/macros/s/AKfycbzZNUs7DX_z71cCniWinmAztbs0wunZjyl7JVKRET0z3QEZDFJyoeDgZSksKWIBCU0u/exec";

let slides=document.querySelectorAll(".slide");
let i=0;

setInterval(()=>{
slides[i].classList.remove("active");
i=(i+1)%slides.length;
slides[i].classList.add("active");
},3000);

let studentData;

/* LOGIN */
async function login(){

let reg=document.getElementById("reg").value;
let dob=document.getElementById("dob").value;

let res=await fetch(API+"?reg="+reg+"&dob="+dob);
let d=await res.json();

if(d.status==="FOUND"){

studentData=d;

document.getElementById("loginPage").style.display="none";
document.getElementById("dataPage").style.display="block";

document.getElementById("info").innerHTML=`
<p><b>Name:</b> ${d.name}</p>
<p><b>Reg:</b> ${d.reg}</p>
<p><b>Course:</b> ${d.course}</p>
<p><b>Grade:</b> ${d.grade}</p>
`;

}else{
alert("Invalid Login");
}

}

/* OPEN CERT */
function openCert(){

document.getElementById("dataPage").style.display="none";
document.getElementById("certPage").style.display="flex";

document.getElementById("cName").innerText=studentData.name;
document.getElementById("cReg").innerText=studentData.reg;
document.getElementById("cCourse").innerText=studentData.course;
document.getElementById("cGrade").innerText=studentData.grade;
document.getElementById("cStart").innerText=studentData.startDate;
document.getElementById("cEnd").innerText=studentData.endDate;

document.getElementById("cPhoto").src=studentData.reg+".jpg";

document.getElementById("cVerify").innerText =
"Verified On: " + studentData.verifyDate;

}

</script>

</body>
</html>
