<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IKON Institute</title>

<style>
body{
  font-family: Arial, sans-serif;
  margin:0;
  background:#f5f7fb;
  color:#222;
}

.container{
  max-width:900px;
  margin:auto;
  background:white;
  box-shadow:0 4px 20px rgba(0,0,0,.08);
}

.header{
  background:linear-gradient(135deg,#1b49d1,#0c2d7a);
  color:white;
  text-align:center;
  padding:25px;
}

.logo{
  width:220px;
  background:white;
  padding:10px;
  border-radius:12px;
}

.title{
  font-size:32px;
  font-weight:bold;
  margin-top:15px;
}

.subtitle{
  font-size:18px;
  margin-top:8px;
}

.contact{
  margin-top:10px;
  font-size:16px;
}

.section{
  padding:30px;
}

.course-box{
  background:#eef3ff;
  padding:15px;
  border-radius:10px;
  margin-top:10px;
  font-size:18px;
}

form{
  margin-top:20px;
}

input, select{
  width:100%;
  padding:12px;
  margin:10px 0;
  border:1px solid #ccc;
  border-radius:8px;
  font-size:16px;
  box-sizing:border-box;
}

button{
  width:100%;
  padding:14px;
  background:#1847d1;
  color:white;
  border:none;
  border-radius:8px;
  font-size:18px;
  cursor:pointer;
}

button:hover{
  background:#1238a9;
}

#msg{
  margin-top:15px;
  color:green;
  text-align:center;
  font-weight:bold;
}
</style>
</head>
<body>

<div class="container">

<div class="header">
  <img src="ikon.jpg" class="logo">
  <div class="title">IKON INSTITUTE</div>
  <div class="subtitle">A Symbol of Success</div>
  <div class="contact">
    Infront of ANUGRAH COLLEGE, GAYA JI, BIHAR 823001<br>
    Contact: 9304669913 / 7368810242
  </div>
</div>

<div class="section">
  <h2>Our Courses</h2>

  <div class="course-box">DCA</div>
  <div class="course-box">ADCA</div>
  <div class="course-box">PGDAMMS Office</div>
  <div class="course-box">Advance Excel</div>

  <h2 style="margin-top:35px;">Course Enquiry Form</h2>

  <form id="enquiryForm">
    <input type="text" id="name" placeholder="Your Name" required>
    <input type="text" id="phone" placeholder="Phone Number" required>

    <select id="course" required>
      <option value="">Select Course</option>
      <option>DCA</option>
      <option>ADCA</option>
      <option>PGDAMMS Office</option>
      <option>Advance Excel</option>
    </select>

    <input type="text" id="address" placeholder="Your Address" required>

    <button type="submit">Submit Enquiry</button>
  </form>

  <div id="msg"></div>
</div>

</div>

<script>
document.getElementById("enquiryForm").addEventListener("submit", function(e){
  e.preventDefault();

  document.getElementById("msg").innerText =
  "Enquiry submitted successfully!";

  this.reset();
});
</script>

</body>
</html>
