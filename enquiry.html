<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Course Enquiry | IKON INSTITUTE</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(-45deg,#0f172a,#1e3a8a,#2563eb,#06b6d4);
    background-size:400% 400%;
    animation:bgMove 12s ease infinite;
    overflow:hidden;
    padding:20px;
}

@keyframes bgMove{
    0%{background-position:0% 50%;}
    50%{background-position:100% 50%;}
    100%{background-position:0% 50%;}
}

.circle{
    position:absolute;
    border-radius:50%;
    background:rgba(255,255,255,0.08);
    animation:float 10s infinite linear;
}
.circle:nth-child(1){width:120px;height:120px;top:10%;left:10%;}
.circle:nth-child(2){width:180px;height:180px;bottom:15%;right:10%;animation-duration:14s;}
.circle:nth-child(3){width:80px;height:80px;top:70%;left:20%;animation-duration:8s;}

@keyframes float{
    0%{transform:translateY(0) rotate(0);}
    50%{transform:translateY(-40px) rotate(180deg);}
    100%{transform:translateY(0) rotate(360deg);}
}

.container{
    width:100%;
    max-width:560px;
    background:rgba(255,255,255,0.12);
    backdrop-filter:blur(18px);
    border:1px solid rgba(255,255,255,0.2);
    border-radius:25px;
    padding:35px;
    box-shadow:0 15px 40px rgba(0,0,0,0.25);
    animation:fadeUp 1s ease;
}

@keyframes fadeUp{
    from{opacity:0; transform:translateY(30px);}
    to{opacity:1; transform:translateY(0);}
}

.topLogo{
    width:90px;
    height:90px;
    object-fit:contain;
    display:block;
    margin:0 auto 15px;
    border-radius:50%;
    background:white;
    padding:6px;
    box-shadow:0 0 20px rgba(255,255,255,0.5);
    animation:logoGlow 2s infinite alternate;
}

@keyframes logoGlow{
    from{
        transform:scale(1);
        box-shadow:0 0 10px rgba(255,255,255,0.4);
    }
    to{
        transform:scale(1.05);
        box-shadow:0 0 25px rgba(255,255,255,0.8);
    }
}

.logoWrap{
    text-align:center;
    margin-bottom:20px;
}

.logo{
    font-size:34px;
    font-weight:800;
    letter-spacing:2px;
    background:linear-gradient(90deg,#ffffff,#dbeafe,#ffffff);
    background-size:200% auto;
    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
    animation:shine 3s linear infinite;
}

.tagline{
    margin-top:8px;
    font-size:15px;
    color:#e0f2fe;
    letter-spacing:1px;
    animation:pulseText 2s infinite;
}

@keyframes shine{
    from{background-position:0% center;}
    to{background-position:200% center;}
}

@keyframes pulseText{
    0%,100%{opacity:1;}
    50%{opacity:0.7;}
}

.info{
    text-align:center;
    color:#ffffff;
    font-size:13px;
    line-height:1.6;
    margin-bottom:22px;
    padding:12px;
    background:rgba(255,255,255,0.08);
    border-radius:14px;
}

.input-group{
    margin-bottom:18px;
}

label{
    display:block;
    color:#fff;
    margin-bottom:6px;
    font-size:14px;
}

input, textarea, select{
    width:100%;
    padding:14px 16px;
    border:none;
    border-radius:12px;
    outline:none;
    background:rgba(255,255,255,0.18);
    color:#fff;
    font-size:15px;
}

input::placeholder,
textarea::placeholder{
    color:#d1d5db;
}

select option{
    color:#000;
}

button{
    width:100%;
    padding:15px;
    border:none;
    border-radius:14px;
    background:linear-gradient(45deg,#22c55e,#16a34a);
    color:#fff;
    font-size:17px;
    font-weight:600;
    cursor:pointer;
}

#message{
    text-align:center;
    color:#bbf7d0;
    margin-top:18px;
    font-weight:500;
}

.course-strip{
    margin-top:25px;
    overflow:hidden;
    white-space:nowrap;
    border-top:1px solid rgba(255,255,255,0.15);
    padding-top:15px;
}

.course-track{
    display:inline-block;
    animation:scroll 18s linear infinite;
    color:#fff;
    font-size:14px;
}

@keyframes scroll{
    from{transform:translateX(100%);}
    to{transform:translateX(-100%);}
}
</style>
</head>
<body>

<div class="circle"></div>
<div class="circle"></div>
<div class="circle"></div>

<div class="container">

<img src="ikon.jpg" class="topLogo">

<div class="logoWrap">
    <div class="logo">IKON INSTITUTE</div>
    <div class="tagline">✨ A Symbol Of Success ✨</div>
</div>

<div class="info">
📍 Infront of Anughrah College Gate No. 1, Gaya Ji, Bihar<br>
📞 9304669913, 7368810242
</div>

<form id="enquiryForm">

<div class="input-group">
<label>Full Name</label>
<input type="text" id="name" placeholder="Enter your name" required>
</div>

<div class="input-group">
<label>Contact Number</label>
<input type="tel" id="contact" placeholder="Enter mobile number" required>
</div>

<div class="input-group">
<label>Select Course</label>
<select id="course" required>
<option value="">Choose Course</option>
<option>DCA</option>
<option>ADCA</option>
<option>PGDAM</option>
<option>MS Office</option>
<option>Advance Excel</option>
<option>Power BI</option>
</select>
</div>

<div class="input-group">
<label>Address</label>
<textarea id="address" rows="3" placeholder="Enter your address"></textarea>
</div>

<button type="submit">Submit Enquiry</button>

<div id="message"></div>
</form>

<div class="course-strip">
<div class="course-track">
✨ Courses Offered: DCA • ADCA • PGDAM • MS Office • Advance Excel • Power BI • Skill Development • Career Growth ✨
</div>
</div>

</div>

<script>
document.getElementById("enquiryForm").addEventListener("submit", function(e){
    e.preventDefault();

    let msg = document.getElementById("message");

    let data = {
        name: document.getElementById("name").value.trim(),
        contact: document.getElementById("contact").value.trim(),
        course: document.getElementById("course").value,
        address: document.getElementById("address").value.trim()
    };

    if(!data.name || !data.contact || !data.course){
        msg.style.color = "#ffb4b4";
        msg.innerHTML = "Please fill all required fields ❌";
        return;
    }

    msg.style.color = "#ffffff";
    msg.innerHTML = "Submitting... ⏳";

    fetch("https://script.google.com/macros/s/AKfycbxXmp2o31ZtGA9aXSWtBca6dEYTOTAYMy10V1ouOnOXBdeqPZT_XtEsywvJqoW7CoflQA/exec", {
        method: "POST",
        mode: "no-cors",
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify(data)
    })
    .then(() => {
        msg.style.color = "#bbf7d0";
        msg.innerHTML = "Enquiry Submitted Successfully ✅";
        document.getElementById("enquiryForm").reset();

        setTimeout(() => {
            msg.innerHTML = "";
        }, 4000);
    })
    .catch((err) => {
        msg.style.color = "#ffb4b4";
        msg.innerHTML = "Submission Failed ❌";
        console.log(err);
    });
});
</script>

</body>
</html>
