<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Admin Dashboard</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Segoe UI',sans-serif;
}

body{
background:linear-gradient(135deg,#eef2ff,#f8fafc);
min-height:100vh;
color:#1e293b;
}

#adminLogin{
height:100vh;
display:flex;
justify-content:center;
align-items:center;
padding:20px;
}

.loginBox{
width:360px;
background:rgba(255,255,255,.8);
backdrop-filter:blur(15px);
padding:35px;
border-radius:22px;
box-shadow:0 8px 30px rgba(0,0,0,.08);
text-align:center;
}

.loginBox h2{
margin-bottom:20px;
color:#1d4ed8;
}

input{
width:100%;
padding:13px 14px;
margin:8px 0;
border:1px solid #dbeafe;
border-radius:12px;
outline:none;
}

button{
padding:12px 18px;
border:none;
border-radius:12px;
background:linear-gradient(90deg,#2563eb,#1d4ed8);
color:white;
cursor:pointer;
}

#dashboard{
display:none;
padding:20px;
max-width:1200px;
margin:auto;
}

.topbar{
background:white;
padding:18px 25px;
border-radius:18px;
box-shadow:0 5px 20px rgba(0,0,0,.05);
display:flex;
justify-content:space-between;
margin-bottom:25px;
}

.cards{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
gap:20px;
margin-bottom:25px;
}

.card{
background:white;
padding:25px;
border-radius:20px;
box-shadow:0 8px 25px rgba(0,0,0,.06);
}

.card h3{
font-size:15px;
color:#64748b;
margin-bottom:8px;
}

.card p{
font-size:34px;
font-weight:700;
color:#2563eb;
}

.section{
background:white;
padding:22px;
border-radius:18px;
box-shadow:0 6px 22px rgba(0,0,0,.05);
margin-bottom:25px;
}

table{
width:100%;
border-collapse:collapse;
margin-top:15px;
}

thead{
background:#eff6ff;
}

th,td{
padding:14px;
text-align:left;
border-bottom:1px solid #e2e8f0;
font-size:14px;
}

.delete{
background:linear-gradient(90deg,#ef4444,#dc2626);
}

#searchResult{
margin-top:15px;
padding:15px;
background:#f8fafc;
border-radius:12px;
line-height:1.8;
}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="adminLogin">
<div class="loginBox">
<h2>Admin Login</h2>
<input id="adminUser" placeholder="Username">
<input id="adminPass" type="password" placeholder="Password">
<button onclick="adminLogin()">Login</button>
</div>
</div>

<!-- DASHBOARD -->
<div id="dashboard">

<div class="topbar">
<h2>Admin Dashboard</h2>
<button onclick="logout()">Logout</button>
</div>

<div class="cards">
<div class="card">
<h3>Total Students</h3>
<p id="totalStudents">0</p>
</div>

<div class="card">
<h3>Certificates</h3>
<p id="totalCerts">0</p>
</div>

<div class="card">
<h3>Student Logins</h3>
<p id="totalLogins">0</p>
</div>
</div>

<!-- SEARCH -->
<div class="section">
<h3>Search Student</h3>
<input id="searchReg" placeholder="Enter Reg No">
<button onclick="searchStudent()">Search</button>
<div id="searchResult"></div>
</div>

<!-- STUDENTS -->
<div class="section">
<h3>Recent Students</h3>
<table>
<thead>
<tr>
<th>Reg</th>
<th>Name</th>
<th>Course</th>
<th>Grade</th>
<th>Action</th>
</tr>
</thead>
<tbody id="studentTable"></tbody>
</table>
</div>

<!-- LOGIN HISTORY -->
<div class="section">
<h3>Student Login History</h3>
<table>
<thead>
<tr>
<th>Date & Time</th>
<th>Name</th>
<th>Reg No</th>
</tr>
</thead>
<tbody id="loginTable"></tbody>
</table>
</div>

</div>

<script>
const API="https://script.google.com/macros/s/AKfycbzZNUs7DX_z71cCniWinmAztbs0wunZjyl7JVKRET0z3QEZDFJyoeDgZSksKWIBCU0u/exec";

/* LOGIN */
function adminLogin(){
let u=document.getElementById("adminUser").value;
let p=document.getElementById("adminPass").value;

if(u==="ikon" && p==="161101"){
document.getElementById("adminLogin").style.display="none";
document.getElementById("dashboard").style.display="block";
localStorage.setItem("adminLogged","yes");
loadStudents();
loadLoginLogs();
}else{
alert("Wrong Login");
}
}

/* AUTO LOGIN */
if(localStorage.getItem("adminLogged")==="yes"){
document.getElementById("adminLogin").style.display="none";
document.getElementById("dashboard").style.display="block";
loadStudents();
loadLoginLogs();
}

/* LOGOUT */
function logout(){
localStorage.removeItem("adminLogged");
location.reload();
}

/* LOAD STUDENTS */
async function loadStudents(){
let res=await fetch(API+"?action=list");
let data=await res.json();

document.getElementById("totalStudents").innerText=data.length;
document.getElementById("totalCerts").innerText=data.length;

let html="";

data.forEach(s=>{
html+=`
<tr>
<td>${s.reg}</td>
<td>${s.name}</td>
<td>${s.course}</td>
<td>${s.grade}</td>
<td>
<button class="delete" onclick="deleteStudent('${s.reg}')">Delete</button>
</td>
</tr>`;
});

document.getElementById("studentTable").innerHTML=html;
}

/* SEARCH */
async function searchStudent(){
let reg=document.getElementById("searchReg").value;
let res=await fetch(API+"?action=search&reg="+reg);
let d=await res.json();

document.getElementById("searchResult").innerHTML=`
<p><b>Name:</b> ${d.name||"-"}</p>
<p><b>Course:</b> ${d.course||"-"}</p>
<p><b>Grade:</b> ${d.grade||"-"}</p>`;
}

/* DELETE */
async function deleteStudent(reg){
if(!confirm("Delete student?")) return;

await fetch(API,{
method:"POST",
body:JSON.stringify({
action:"delete",
reg:reg
})
});

loadStudents();
}

/* LOGIN HISTORY */
async function loadLoginLogs(){
let res=await fetch(API+"?action=logs");
let data=await res.json();

document.getElementById("totalLogins").innerText=data.length;

let html="";

data.reverse().forEach(l=>{
html+=`
<tr>
<td>${l.time}</td>
<td>${l.name}</td>
<td>${l.reg}</td>
</tr>`;
});

document.getElementById("loginTable").innerHTML=html;
}
</script>
</body>
</html>
