<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>IKON Institute - Certificate Verification</title>
  <style>
    body { font-family: Arial, sans-serif; background:#f4f7fb; margin:0; padding:20px; color:#222; }
    .card { max-width: 900px; margin:auto; background:white; border-radius:16px; box-shadow:0 4px 20px rgba(0,0,0,.08); overflow:hidden; }
    .header { text-align:center; padding:20px; border-bottom:1px solid #eee; }
    .header img { max-width:260px; }
    .title { font-size:28px; font-weight:bold; color:#1847d1; margin-top:10px; }
    .subtitle { color:#666; }
    .verified { background:#eafaf0; color:#117a37; text-align:center; padding:14px; font-size:22px; font-weight:bold; }
    .details { padding:24px; display:grid; grid-template-columns: 1fr 1fr; gap:16px; }
    .item { background:#f8fafc; padding:14px; border-radius:10px; }
    .label { font-size:12px; color:#666; text-transform:uppercase; }
    .value { font-size:18px; font-weight:600; margin-top:4px; }
    .pdf { padding:24px; }
    iframe { width:100%; height:600px; border:none; border-radius:10px; }
    .footer { text-align:center; padding:20px; color:#777; font-size:14px; }
    .error { text-align:center; padding:40px; color:#b00020; font-size:20px; }
    @media (max-width:700px){ .details{grid-template-columns:1fr;} iframe{height:420px;} }
  </style>
</head>
<body>
  <div class="card" id="app">Loading...</div>

<script>
const params = new URLSearchParams(window.location.search);
const reg = params.get('reg');

fetch('students.json')
  .then(r => r.json())
  .then(students => {
    const student = students.find(s => s.reg === reg);
    const app = document.getElementById('app');

    if (!student) {
      app.innerHTML = `<div class="error">Certificate not found or invalid QR code.</div>`;
      return;
    }

    app.innerHTML = `
      <div class="header">
        <img src="ikon.jpg" alt="IKON Institute Logo" />
        <div class="title">IKON Institute</div>
        <div class="subtitle">A Symbol of Success</div>
      </div>
      <div class="verified">✓ CERTIFICATE VERIFIED</div>
      <div class="details">
        <div class="item"><div class="label">Student Name</div><div class="value">${student.name}</div></div>
        <div class="item"><div class="label">Registration Number</div><div class="value">${student.reg}</div></div>
        <div class="item"><div class="label">Course</div><div class="value">${student.course}</div></div>
        <div class="item"><div class="label">Grade</div><div class="value">${student.grade}</div></div>
        <div class="item"><div class="label">Course Start Date</div><div class="value">${student.start}</div></div>
        <div class="item"><div class="label">Course End Date</div><div class="value">${student.end}</div></div>
      </div>
      <div class="pdf">
        <h3>Certificate Preview</h3>
        <iframe src="${student.pdf}"></iframe>
      </div>
      <div class="footer">Official Verification Portal - IKON Institute</div>`;
  });
</script>
</body>
</html>
